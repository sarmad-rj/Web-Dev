<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        width: 100%;
        background: lightblue;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .cont {
        height: 300px;
        width: 400px;
        background: rgb(218, 230, 173);
        border: 2px solid black;
        color: aqua;
        position: relative;
      }
      .box {
        height: 50px;
        width: 50px;
        background: rgb(2, 186, 248);
        animation: dash 6s ease-in-out infinite;
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      @keyframes dash {
        0% {
          top: 0;
          left: 0;
          transform: rotate(0deg);
        }
        25% {
          top: 0px;
          left: 345px;
          border-radius: 100%;
          transform: rotate(90deg);
        }
        50% {
          top: 250px;
          left: 345px;
          border-radius: 0%;
          transform: rotate(180deg);
        }
        75% {
          top: 245px;
          left: 0px;
          background-color: red;
          transform: rotate(270deg);
        }
        100% {
          top: 0;
          left: 0;
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="cont">
      <div class="box">box</div>
    </div>
  </body>
</html>
